$kind: http-request
name: 4. Andrea (USER) crea evento -> 403
url: "{{baseUrl}}/api/events"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAndrea}}
body:
  type: json
  content: |-
    {
      "eventCode": "TST-1",
      "name": "Test",
      "category": "MUSIC",
      "eventDate": "2030-12-15T20:00:00",
      "minimumAge": 18,
      "venueCode": "VEN-SMR-01"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 4000
