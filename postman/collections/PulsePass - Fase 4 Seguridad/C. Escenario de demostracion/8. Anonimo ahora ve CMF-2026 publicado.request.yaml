$kind: http-request
url: "{{baseUrl}}/api/events/published"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Incluye CMF-2026", () => pm.expect(pm.response.text()).to.include("CMF-2026"));
    language: text/javascript
order: 8000
