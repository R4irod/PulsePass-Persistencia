$kind: http-request
name: 9. Andrea compra SU entrada -> 201
url: "{{baseUrl}}/api/tickets"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tokenAndrea}}
body:
  type: json
  content: |-
    {
      "userEmail": "andrea@email.com",
      "eventCode": "CMF-2026",
      "type": "VIP"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("ticketAndrea", pm.response.json().ticketCode);
    language: text/javascript
order: 9000
