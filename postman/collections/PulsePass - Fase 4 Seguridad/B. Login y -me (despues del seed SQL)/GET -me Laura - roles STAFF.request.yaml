$kind: http-request
name: GET /me Laura -> roles STAFF
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Authorization: Bearer {{tokenLaura}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Rol STAFF (si falla, falta correr el seed SQL)", () => pm.expect(pm.response.json().roles).to.include("STAFF"));
    language: text/javascript
order: 8000
