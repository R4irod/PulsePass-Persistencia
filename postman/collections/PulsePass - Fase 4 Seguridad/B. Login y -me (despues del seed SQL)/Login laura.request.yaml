$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "laura",
      "password": "UnaFraseSegura2026!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test("Tiene Bearer y expiresIn = 900", () => { pm.expect(j.tokenType).to.eql("Bearer"); pm.expect(j.expiresIn).to.eql(900); });
      pm.collectionVariables.set("tokenLaura", j.accessToken);
    language: text/javascript
order: 3000
