$kind: http-request
name: GET /me Andrea -> roles USER
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Authorization: Bearer {{tokenAndrea}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Rol USER", () => pm.expect(pm.response.json().roles).to.include("USER"));
    language: text/javascript
order: 7000
