$kind: http-request
name: Login usuario inexistente -> 401 (mismo mensaje)
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "nadie",
      "password": "incorrecta-123456"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 6000
