$kind: http-request
name: Login con password incorrecta -> 401 generico
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "andrea",
      "password": "incorrecta-123456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 401", () => pm.response.to.have.status(401));
      pm.test("Formato ErrorResponse", () => { const j = pm.response.json(); pm.expect(j).to.have.keys(["timestamp","status","error","message","details"]); });
    language: text/javascript
order: 5000
