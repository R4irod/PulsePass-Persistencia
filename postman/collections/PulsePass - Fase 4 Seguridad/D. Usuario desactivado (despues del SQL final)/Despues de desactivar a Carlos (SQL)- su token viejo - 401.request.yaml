$kind: http-request
name: "Despues de desactivar a Carlos (SQL): su token viejo -> 401"
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Authorization: Bearer {{tokenCarlos}}
scripts:
  - type: afterResponse
    code: pm.test("Status 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 1000
