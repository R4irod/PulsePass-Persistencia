$kind: http-request
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "laura",
      "email": "laura@email.com",
      "firstName": "Laura",
      "lastName": "Diaz",
      "phone": "3001234567",
      "city": "Santa Marta",
      "birthDate": "1995-07-01",
      "password": "UnaFraseSegura2026!"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 3000
