$kind: http-request
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "carlos",
      "email": "carlos@email.com",
      "firstName": "Carlos",
      "lastName": "Perez",
      "phone": "3001234567",
      "city": "Santa Marta",
      "birthDate": "1998-03-10",
      "password": "UnaFraseSegura2026!"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
